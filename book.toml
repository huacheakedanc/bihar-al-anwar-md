[book]
authors = ["علامه محمدباقر مجلسی"]
language = "ar"
multilingual = false
src = "."
title = "بحار الأنوار الجامعة لدرر أخبار الأئمة الأطهار"

[output.html]
git-repository-url = "https://github.com/huacheakedanc/bihar-al-anwar-md"
default-theme = "light"
preferred-dark-theme = "navy"
text-direction = "rtl"
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
